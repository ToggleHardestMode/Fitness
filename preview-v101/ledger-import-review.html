<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>FitnessPilot | Import review fixture</title>
<link rel="stylesheet" href="./ledger-import-review.css">
<script type="module" src="./ledger-import-review.js"></script>
</head>
<body>
<main>
<header><p class="eyebrow">FITNESSPILOT / DISPOSABLE PROTOTYPE</p><h1>Review workout imports</h1>
<p>Use synthetic CSVs only. This page uses a separate fixture database. It never reads or changes your live workouts or Food Diary.</p></header>
<fieldset id="controls" disabled>
<section><h2>1. Choose sources</h2><label for="files">Synthetic CSV files (up to 20)</label>
<input id="files" type="file" accept=".csv,text/csv" multiple>
<div class="actions"><button id="demo" type="button">Load demo batch</button><button id="preview" type="button">Review batch</button><button id="refresh" type="button">Reload fixture / restart review</button></div>
<p id="sources">No files selected.</p></section>
<section><h2>2. Resolve exceptions</h2><div id="summary" aria-live="polite">No review yet.</div>
<div id="exceptions"></div></section>
<section><h2>3. Confirm reviewed changes</h2><div id="audit"></div>
<label class="check"><input id="confirm" type="checkbox" disabled> I reviewed the listed changes and approve writing to the disposable fixture only.</label>
<button id="apply" type="button" disabled>Apply reviewed batch</button>
<p id="revision"></p></section>
</fieldset>
<p id="status" role="status" aria-live="polite"></p>
</main>
</body></html>
